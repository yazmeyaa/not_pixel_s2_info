<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>4$PX Pixel Monitor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #00ff88;
            --link-color: #00c3ff;
            --link-bg: #1a1a1a;
            --border-color: #2f2f2f;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 2rem;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 2rem;
            font-size: 2rem;
            text-align: center;
        }

        #log {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-block {
            background: var(--link-bg);
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            word-break: break-all;
        }

        .link-block a {
            color: var(--link-color);
            text-decoration: none;
            font-size: 1.1rem;
        }

        .link-block a:hover {
            text-decoration: underline;
            color: #66e0ff;
        }
    </style>
</head>
<body>
    <h1>4$PX Pixels Live Feed</h1>
    <div id="log">Waiting for data...</div>

    <script>
        const socket = io();
        const log = document.getElementById('log');

        socket.on('got_pixels', ({ links }) => {
            log.innerHTML = '';

            if (!links || links.length === 0) {
                log.innerHTML = `<strong>No links yet</strong>`;
                return;
            }

            const uniqueSortedLinks = Array.from(new Set(links)).sort();

            for (const link of uniqueSortedLinks) {
                const block = document.createElement('div');
                block.className = 'link-block';

                const linkElement = document.createElement('a');
                linkElement.href = link;
                linkElement.target = '_blank';
                linkElement.innerText = link;

                block.appendChild(linkElement);
                log.appendChild(block);
            }
        });
    </script>
</body>
</html>
